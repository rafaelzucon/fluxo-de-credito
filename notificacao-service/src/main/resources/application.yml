server:
  port: 8081

spring:
  application:
    name: notificacao-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${DB_USER:notificacao}
    password: ${DB_PASSWORD:notificacao}
    hikari:
      maximum-pool-size: 10
  flyway:
    enabled: true
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    properties:
      mail.smtp.connectiontimeout: 2000
      mail.smtp.timeout: 3000
      mail.smtp.writetimeout: 3000
  cloud:
    aws:
      region:
        static: ${AWS_REGION:us-east-1}
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID:test}
        secret-key: ${AWS_SECRET_ACCESS_KEY:test}
      endpoint: ${AWS_ENDPOINT:http://localhost:4566}
      sqs:
        listener:
          max-concurrent-messages: 10
          max-messages-per-poll: 10
          poll-timeout: 10s

app:
  filas:
    email: ${FILA_EMAIL:fila-email}
    push: ${FILA_PUSH:fila-push}
  email:
    remetente: ${EMAIL_REMETENTE:nao-responda@fluxocredito.com.br}
  push:
    url: ${PUSH_URL:http://localhost:8089}
    timeout-conexao: 2s
    timeout-leitura: 3s
  # Deve ser >= wait-duration-in-open-state para a mensagem não reaparecer com o circuito ainda aberto.
  visibilidade-circuito-aberto: 30s

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        slow-call-duration-threshold: 2s
        slow-call-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
    instances:
      email-provider:
        base-config: default
      push-provider:
        base-config: default

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true
