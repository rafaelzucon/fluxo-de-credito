server:
  port: 8080

spring:
  application:
    name: solicitacao-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${DB_USER:solicitacao}
    password: ${DB_PASSWORD:solicitacao}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    consumer:
      group-id: solicitacao-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  cloud:
    aws:
      region:
        static: ${AWS_REGION:us-east-1}
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID:test}
        secret-key: ${AWS_SECRET_ACCESS_KEY:test}
      endpoint: ${AWS_ENDPOINT:http://localhost:4566}

app:
  kafka:
    topico-solicitacao-criada: solicitacao-criada
    topico-decisao-tomada: decisao-tomada
    # 1 tentativa no tópico principal + 3 no tópico de retry; depois, dead letter topic
    tentativas: 4
    intervalo-retry: 5s
    intervalo-circuito-aberto: 5s
    timeout-publicacao: 10s
  sns:
    topico-decisao-arn: ${SNS_TOPICO_DECISAO_ARN:arn:aws:sns:us-east-1:000000000000:decisao-credito}
  republicacao:
    intervalo: 15s

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        slow-call-duration-threshold: 2s
        slow-call-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
    instances:
      kafka-producer:
        base-config: default
      sns-publisher:
        base-config: default

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true
